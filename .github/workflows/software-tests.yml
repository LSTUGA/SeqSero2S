name: Software tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install build
      - run: python -m build
      - name: Smoke-test installed wheel
        run: |
          python -m venv /tmp/seqsero2s-test
          /tmp/seqsero2s-test/bin/python -m pip install --no-deps dist/*.whl
          /tmp/seqsero2s-test/bin/SeqSero2S.py --help
          /tmp/seqsero2s-test/bin/SeqSero2S.py --version
          /tmp/seqsero2s-test/bin/python -c 'import sys; from pathlib import Path; assert (Path(sys.prefix) / "seqsero2s_db" / "antigens.pickle").is_file()'
